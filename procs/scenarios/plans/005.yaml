id: PLANS-005
module: plans
description: Change tenant 4 to plan 3 effective 2026-03-15.
entrypoint: billing.sp_change_plan
kind: procedure
inputs:
  - {name: tenant_id, type: uuid, value: 00000000-0000-0000-0000-000000000004}
  - {name: plan_id, type: uuid, value: 10000000-0000-0000-0000-000000000003}
  - {name: effective_on, type: date, value: 2026-03-15}
capture_query: "SELECT plan_id::text, starts_on, ends_on, status FROM billing.subscriptions WHERE tenant_id = '00000000-0000-0000-0000-000000000004' ORDER BY starts_on"
fields:
  - name: subscriptions
    collect_rows: true
    columns: {plan_id: text, starts_on: date, ends_on: date, status: text}
probes:
  - {id: subscription_rows, collect_rows: true, query: "SELECT plan_id::text, starts_on, ends_on, status FROM billing.subscriptions WHERE tenant_id = '00000000-0000-0000-0000-000000000004' ORDER BY starts_on"}

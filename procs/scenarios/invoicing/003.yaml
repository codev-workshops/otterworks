id: INVOICE-003
module: invoicing
description: Issue tenant 9 for 2026-02-01 through 2026-02-28 after two credit dates.
entrypoint: billing.sp_issue_invoice
kind: procedure
inputs:
  - {name: tenant_id, type: uuid, value: 00000000-0000-0000-0000-000000000009}
  - {name: period_start, type: date, value: 2026-02-01}
  - {name: period_end, type: date, value: 2026-02-28}
capture_query: "SELECT id::text, issued_on::text, remaining_amount::text FROM billing.credit_notes WHERE tenant_id = '00000000-0000-0000-0000-000000000009' ORDER BY issued_on, id"
fields:
  - {name: credit_ids, from: id, type: text, collect: true}
  - {name: issued_on, from: issued_on, type: date, collect: true}
  - {name: remaining, from: remaining_amount, type: decimal, collect: true}
probes:
  - id: invoice_state
    collect_rows: true
    query: "SELECT status, subtotal::text AS subtotal, tax::text AS tax, total::text AS total FROM billing.invoices WHERE period_id = md5('00000000-0000-0000-0000-000000000009' || '2026-02-01')::uuid"

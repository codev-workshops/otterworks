id: DUNNING-002
module: dunning
description: Schedule tenant accounts from 2026-02-14.
entrypoint: billing.sp_schedule_dunning
kind: procedure
inputs:
  - {name: as_of, type: date, value: 2026-02-14}
capture_query: "SELECT scheduled_for::text, status FROM billing.dunning_attempts WHERE invoice_id = '60000000-0000-0000-0000-000000000001' ORDER BY attempt_no DESC LIMIT 1"
fields:
  - {name: scheduled_for, from: scheduled_for, type: text}
  - {name: status, from: status, type: text}
probes:
  - id: schedule_rows
    collect_rows: true
    query: "SELECT invoice_id::text AS invoice_id, attempt_no, scheduled_for::text AS scheduled_for, status FROM billing.dunning_attempts ORDER BY invoice_id, attempt_no"

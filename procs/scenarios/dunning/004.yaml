id: DUNNING-004
module: dunning
description: Apply account handling for 2026-02-28.
entrypoint: billing.sp_suspend_overdue
kind: procedure
inputs:
  - {name: as_of, type: date, value: 2026-02-28}
capture_query: "SELECT status, suspended_on::text FROM billing.subscriptions WHERE tenant_id = '00000000-0000-0000-0000-000000000005'"
fields:
  - {name: status, from: status, type: text}
  - {name: suspended_on, from: suspended_on, type: text}
probes:
  - id: suspension_notifications
    collect_rows: true
    query: "SELECT id::text AS id, tenant_id::text AS tenant_id, kind, sent_at FROM billing.notifications WHERE kind = 'suspension' ORDER BY tenant_id, sent_at"

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devin-cw-namespaces
  labels:
    demo: aws-cloud-worker
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devin-cw-namespaces
  labels:
    demo: aws-cloud-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devin-cw-namespaces
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: devin-cw-observer
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: devin-cw-builder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devin-cw-observer
  namespace: otterworks-cloud-worker
  labels:
    demo: aws-cloud-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: devin-cw-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devin-cw-observer
  namespace: otterworks-main
  labels:
    demo: aws-cloud-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: devin-cw-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devin-cw-builder
  namespace: otterworks-cloud-worker
  labels:
    demo: aws-cloud-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: devin-cw-builder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devin-cw-monitoring-view
  namespace: otterworks-cloud-worker
  labels:
    demo: aws-cloud-worker
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "prometheusrules"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devin-cw-monitoring-edit
  namespace: otterworks-cloud-worker
  labels:
    demo: aws-cloud-worker
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "prometheusrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devin-cw-observer-monitoring
  namespace: otterworks-cloud-worker
  labels:
    demo: aws-cloud-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devin-cw-monitoring-view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: devin-cw-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devin-cw-builder-monitoring
  namespace: otterworks-cloud-worker
  labels:
    demo: aws-cloud-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devin-cw-monitoring-edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: devin-cw-builder

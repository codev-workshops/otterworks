# OWASP ZAP baseline rule configuration for OtterWorks.
#
# Format: <rule id>\t<WARN|IGNORE|FAIL>\t(optional comment)
# Used by: make dast-zap  (zap-baseline.py -c zap/zap-baseline.conf)
#
# ZAP provides the broad passive sweep of the edge; the authenticated attack
# cases live in security/dast/harness/probes and are gated separately by
# dast_scan.py. Rules that duplicate a probe are set to WARN here so a finding
# is gated in exactly one place.

10015	WARN	(Re-examine Cache-control Directives)
10020	WARN	(Missing Anti-clickjacking Header - gated by DAST-MISSING-SECURITY-HEADERS)
10021	WARN	(X-Content-Type-Options Missing - gated by DAST-MISSING-SECURITY-HEADERS)
10035	WARN	(Strict-Transport-Security Missing - gated by DAST-MISSING-SECURITY-HEADERS)
10038	WARN	(Content Security Policy Missing - gated by DAST-MISSING-SECURITY-HEADERS)
10098	WARN	(Cross-Domain Misconfiguration - gated by DAST-CORS-ORIGIN-REFLECTION)
10063	WARN	(Permissions Policy Header Not Set)
10096	IGNORE	(Timestamp Disclosure - JSON APIs return epoch fields by design)
10109	IGNORE	(Modern Web Application - informational)
90005	IGNORE	(Sec-Fetch headers - not applicable to API clients)

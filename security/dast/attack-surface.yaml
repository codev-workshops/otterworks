# OtterWorks attack surface for dynamic (runtime) security testing.
#
# This file is the target spec the DAST harness and the ZAP scan share: what is
# reachable at the edge, what each route is supposed to require, and what must
# never appear in a response. Probes in security/dast/harness/probes assert the
# `expect` clauses below against the *running* application.

target:
  # Overridden with --target / OTTERWORKS_DAST_TARGET (a tenant URL, a preview
  # environment, or the local docker-compose stack).
  default_base_url: http://localhost:8080
  entrypoint: api-gateway
  notes: >
    Every backend service is reachable only through the gateway. Scanning a
    backend port directly bypasses the controls under test and produces
    findings that do not reflect the deployed edge.

identities:
  # Seeded per scan, namespaced by run id, so concurrent scans never collide.
  - name: attacker
    role: standard user
    purpose: the caller performing every attack
  - name: victim
    role: standard user
    purpose: owns the private objects the attacker must not reach

routes:
  - prefix: /api/v1/auth
    service: auth-service
    public:
      - POST /api/v1/auth/login
      - POST /api/v1/auth/register
    expect:
      - failed logins are throttled or locked out per account
      - responses never contain password, passwordHash, salt, or mfaSecret
  - prefix: /api/v1/documents
    service: document-service
    auth: bearer JWT
    expect:
      - reads and writes are scoped to the document owner
      - identity comes from validated JWT claims, never from a request header
      - responses are application/json, never renderable HTML
      - list filters (title, content_type, sort, direction) never reach SQL unescaped
      - GET /api/v1/documents/exports only serves files inside the export archive root
      - GET /api/v1/documents/shared only accepts tokens that cannot be derived offline
  - prefix: /api/v1/files
    service: file-service
    auth: bearer JWT
    expect:
      - object ids from another owner return 403/404
  - prefix: /api/v1/search
    service: search-service
    auth: bearer JWT
    expect:
      - results are scoped to the caller's owner id
      - query parameters never reach a SQL or filter expression unescaped
  - prefix: /api/v1/admin
    service: admin-service
    auth: bearer JWT + admin role
    expect:
      - unauthenticated callers receive 401
  - prefix: /api/v1/audit
    service: audit-service
    auth: bearer JWT
    expect:
      - unauthenticated callers receive 401

# Routes the coverage gate (`make dast-coverage`) is allowed to leave unattacked.
# The inventory it compares against is read from the services' source, so an entry
# here is a deliberate hole in the suite and needs a reason, exactly like an
# accepted finding in baseline.json.
#
#   - method: GET
#     path: /api/v1/example/{}
#     reason: why nothing attacks this, and what would have to change to fix that
coverage_exemptions: []

# Routes the anonymous sweep must not send. It issues each route's own method, so
# a route that turns out to be unauthenticated is not just reported but carried
# out. Creating an object under a scan-owned id is fine; an operation on the whole
# tenant is not, however disposable the target is meant to be. A route listed here
# is reported by the coverage gate as not swept, with this reason.
sweep_exclusions:
  - method: POST
    path: /api/v1/search/reindex
    reason: rebuilds the tenant's whole index; needs a probe that can undo it
  - method: PUT
    path: /api/v1/notifications/read-all
    reason: mutates every notification in the tenant, including other identities'
  - method: POST
    path: /api/v1/search/index/document
    reason: writes into the shared index rather than a scan-owned object
  - method: POST
    path: /api/v1/search/index/file
    reason: writes into the shared index rather than a scan-owned object
  - method: DELETE
    path: /api/v1/search/index/{}/{}
    reason: a swept id would be a real index entry, not a scan-owned one

operational:
  - path: /health
    expect: reachable unauthenticated, no build or dependency detail
  - path: /metrics
    expect: not exposed through the public edge

global_expectations:
  headers:
    - X-Content-Type-Options: nosniff
    - X-Frame-Options set
    - Content-Security-Policy set
    - Referrer-Policy set
    - Strict-Transport-Security set on TLS listeners
  cors:
    - Access-Control-Allow-Origin only for configured origins
    - never wildcard origin together with Allow-Credentials
  rate_limiting:
    - keyed on an identity the client cannot choose
    - X-Forwarded-For honoured only from trusted proxy hops
  errors:
    - unhandled input returns a generic JSON envelope
    - no stack traces, SQL text, or connection strings in any response body

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ldm"
version = "0.1.0"
description = "Selective legacy data migration job: Db2 fixed-width unload -> PostgreSQL (or Azure SQL), staged with a run ledger"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
db2 = ["ibm_db>=3.2,<4"]
oracle = ["oracledb>=3.4,<5"]
postgresql = ["psycopg[binary]>=3.1,<4"]
s3 = ["boto3>=1.34,<2"]
spark = ["pyspark>=3.5,<4"]
azuresql = ["pyodbc>=5.1,<6", "azure-storage-blob>=12.19,<13", "azure-identity>=1.15,<2"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ldm = "ldm.__main__:main"

[tool.setuptools.packages.find]
include = ["ldm*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]

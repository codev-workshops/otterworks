{{- if .Values.networkPolicy.enabled }}
# Only the shared ingress controller (and monitoring) may reach the web pod;
# the in-namespace poller CronJob is allowed too. Egress is unrestricted
# (DynamoDB, Devin API, webhook targets).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "otter-projects.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "otter-projects.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "otter-projects.name" . }}
              app.kubernetes.io/component: poller
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
{{- end }}

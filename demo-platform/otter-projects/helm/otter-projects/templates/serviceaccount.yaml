apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "otter-projects.labels" . | nindent 4 }}
  annotations:
    # IRSA role scoped to the otterworks-projects table only.
    eks.amazonaws.com/role-arn: {{ include "otter-projects.roleArn" . }}

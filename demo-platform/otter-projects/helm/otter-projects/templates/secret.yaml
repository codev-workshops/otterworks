{{- if .Values.secret.create }}
{{- range $k := list "passcode" "sessionSecret" "apiKey" "webhookSecret" }}
{{- if not (index $.Values.secret $k) }}
{{- fail (printf "secret.%s is required (pass via -f secrets.yaml or --set-file; never on argv). Set secret.create=false to manage the Secret out-of-band." $k) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "otter-projects.secretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "otter-projects.labels" . | nindent 4 }}
type: Opaque
data:
  PROJECTS_PASSCODE: {{ .Values.secret.passcode | b64enc | quote }}
  SESSION_SECRET: {{ .Values.secret.sessionSecret | b64enc | quote }}
  PROJECTS_API_KEY: {{ .Values.secret.apiKey | b64enc | quote }}
  PROJECTS_WEBHOOK_SECRET: {{ .Values.secret.webhookSecret | b64enc | quote }}
  DEVIN_API_KEY: {{ .Values.secret.devinApiKey | default "" | b64enc | quote }}
  DEVIN_WEBHOOK_SECRET: {{ .Values.secret.devinWebhookSecret | default "" | b64enc | quote }}
{{- end }}

name: Demo reaper (legacy data migration)

# Destroys expired legacy-data-migration demo namespaces across AWS, Azure and
# the EKS cluster. Discovery is by tag demo=legacy-data-migration + expires
# (CONTRACTS.md §3.3); each expired token runs scripts/demo-destroy.sh.

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually destroy (false = report only)"
        type: boolean
        default: true
      grace:
        description: "Grace period after expires before reaping (e.g. 15m, 2h)"
        type: string
        default: "15m"

concurrency:
  group: demo-reaper
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: otterworks-dev

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4
      - uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Reap expired demo namespaces
        env:
          # Azure service principal (Contributor). az login happens inside the
          # scripts; ARM_* for Terraform are derived from the same values.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # azurerm backend for infrastructure/terraform/azure (per-token key).
          TFSTATE_AZ_ACCOUNT: ${{ secrets.TFSTATE_AZ_ACCOUNT }}
          TFSTATE_AZ_RESOURCE_GROUP: ${{ secrets.TFSTATE_AZ_RESOURCE_GROUP }}
          TFSTATE_AZ_CONTAINER: ${{ secrets.TFSTATE_AZ_CONTAINER }}
          # teardown-tenant.sh drops the tenant PostgreSQL database.
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REAPER_GRACE: ${{ inputs.grace || '15m' }}
          EVENT_NAME: ${{ github.event_name }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ] || [ "$APPLY" = "true" ]; then
            MODE=--apply
          else
            MODE=--dry-run
          fi
          ./scripts/demo-reaper.sh "$MODE" --grace "$REAPER_GRACE"

      - name: Upload destroy transcripts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: demo-reaper-transcripts-${{ github.run_id }}
          path: .demo/**/*.log
          if-no-files-found: ignore
          retention-days: 30

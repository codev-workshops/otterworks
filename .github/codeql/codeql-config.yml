name: OtterWorks CodeQL config

queries:
  - uses: security-extended

paths-ignore:
  - '**/node_modules/**'
  - '**/vendor/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/target/**'
  - '**/.gradle/**'
  - '**/bin/**'
  - '**/obj/**'
  - '**/coverage/**'
  - '**/__pycache__/**'
  - '**/*.min.js'
  - '**/testdata/**'
  - '**/fixtures/**'
  - 'docs/**'

apiVersion: v1
kind: ConfigMap
metadata:
  name: db2-archive-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "db2-archive.labels" . | nindent 4 }}
  annotations:
    {{- include "db2-archive.annotations" . | nindent 4 }}
data:
  health.py: |-
{{ .Files.Get "files/health.py" | indent 4 }}
---
# DDL from migration/source/db2/ddl (files/ddl is a symlink into the repo; `helm package` copies it).
apiVersion: v1
kind: ConfigMap
metadata:
  name: db2-archive-ddl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "db2-archive.labels" . | nindent 4 }}
  annotations:
    {{- include "db2-archive.annotations" . | nindent 4 }}
data:
{{ (.Files.Glob "files/ddl/*.sql").AsConfig | indent 2 }}
---
# Seed generator + loader from migration/source/seed (files/seed is a symlink into the repo).
apiVersion: v1
kind: ConfigMap
metadata:
  name: db2-archive-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "db2-archive.labels" . | nindent 4 }}
  annotations:
    {{- include "db2-archive.annotations" . | nindent 4 }}
data:
{{ (.Files.Glob "files/seed/{__init__,__main__,spec,tables,generate,fixture}.py").AsConfig | indent 2 }}
{{ (.Files.Glob "files/seed/load.sh").AsConfig | indent 2 }}

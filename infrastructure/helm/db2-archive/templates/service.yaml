apiVersion: v1
kind: Service
metadata:
  name: db2-archive
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "db2-archive.labels" . | nindent 4 }}
  annotations:
    {{- include "db2-archive.annotations" . | nindent 4 }}
spec:
  # ClusterIP only: Db2 is never exposed outside the cluster (AGENTS.md, CONTRACTS.md 13.1).
  type: ClusterIP
  selector:
    {{- include "db2-archive.selectorLabels" . | nindent 4 }}
  ports:
    - name: db2
      port: {{ .Values.service.port }}
      targetPort: db2
      protocol: TCP
    - name: health
      port: {{ .Values.health.port }}
      targetPort: health
      protocol: TCP

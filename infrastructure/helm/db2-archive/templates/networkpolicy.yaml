{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db2-archive
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "db2-archive.labels" . | nindent 4 }}
  annotations:
    {{- include "db2-archive.annotations" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "db2-archive.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Db2 (50000): only same-namespace pods that opt in with ldm/db2-client=true
    # (migration job, seed init job, UNLOAD01 runner). Never from other namespaces or ingress.
    - from:
        - podSelector:
            matchLabels:
              ldm/db2-client: "true"
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    # Health (8080): monitoring namespace, plus the node CIDRs when the CNI enforces policy on
    # kubelet probe traffic.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
        {{- range .Values.networkPolicy.nodeCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.health.port }}
          protocol: TCP
{{- end }}

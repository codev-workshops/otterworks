apiVersion: v1
kind: Service
metadata:
  name: oracle-archive
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oracle-archive.labels" . | nindent 4 }}
  annotations:
    {{- include "oracle-archive.annotations" . | nindent 4 }}
spec:
  # ClusterIP only: the source estate is never exposed outside the cluster (AGENTS.md).
  type: ClusterIP
  selector:
    {{- include "oracle-archive.selectorLabels" . | nindent 4 }}
  ports:
    - name: sqlnet
      port: {{ .Values.database.port }}
      targetPort: sqlnet
      protocol: TCP

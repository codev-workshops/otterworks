{{- /* Static binding only: the PV (EBS gp3) is created by ops Terraform; storageClassName "" disables dynamic provisioning. */ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oracle-archive-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oracle-archive.labels" . | nindent 4 }}
  annotations:
    {{- include "oracle-archive.annotations" . | nindent 4 }}
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: {{ required "pv.volumeName (the static PV created by Terraform) is required" .Values.pv.volumeName | quote }}
  resources:
    requests:
      storage: {{ .Values.pv.size | quote }}

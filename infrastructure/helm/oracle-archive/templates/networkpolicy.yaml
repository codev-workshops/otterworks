{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oracle-archive
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oracle-archive.labels" . | nindent 4 }}
  annotations:
    {{- include "oracle-archive.annotations" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "oracle-archive.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # SQL*Net only from same-namespace pods that opt in with the client label (migration Job,
    # seed Job). Never from other namespaces or the ingress. Probes are exec probes, so no
    # health port is opened.
    - from:
        - podSelector:
            matchLabels:
              {{ .Values.networkPolicy.clientLabel }}: "true"
      ports:
        - port: {{ .Values.database.port }}
          protocol: TCP
{{- end }}

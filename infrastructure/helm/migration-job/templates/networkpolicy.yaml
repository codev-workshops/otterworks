{{- if .Values.networkPolicy.enabled }}
# A Job serves nothing (no Service, no Spark UI): deny all ingress. Egress (Db2 in-namespace, the shared RDS
# endpoint, S3; Azure SQL / Blob only for the optional Azure overlay) is open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "migration-job.labels" . | nindent 4 }}
  annotations:
    demo/expires-at: {{ .Values.expires | quote }}
spec:
  podSelector:
    matchLabels:
      {{- include "migration-job.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: []
{{- end }}

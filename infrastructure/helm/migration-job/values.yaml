# One Job per invocation: helm install ldm-extract-r1 ./migration-job -n otterworks-d24-after \
#   --set namespaceToken=d24-after --set stage=extract --set runId=r20260924150000 \
#   --set image.tag=<tag> --set expires=2026-10-01T00:00:00Z
image:
  registry: 599083837640.dkr.ecr.us-east-1.amazonaws.com
  repositoryPrefix: otterworks-demo
  # Defaults to <registry>/<repositoryPrefix>/<namespaceToken>/ldm-job; set to override entirely.
  repository: ""
  tag: ""          # required: ECR uses immutable tags
  pullPolicy: IfNotPresent

# Demo token (<run>-<state>); used for the manifest overlay, labels and the ldm --namespace argument.
namespaceToken: ""
# extract | load | validate | purge | reconcile | all | init
stage: "all"
# ^[a-z0-9][a-z0-9-]{2,62}$ ; omitted for stage=init
runId: ""
# Absolute UTC expiry (YYYY-MM-DDTHH:MM:SSZ); recorded on every object as demo/expires
expires: ""

manifestPath: /app/migration/manifest.yaml
# Extra args appended after the contract args (e.g. --apply-sql paths for init)
extraArgs: []

job:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 14400
  restartPolicy: Never

# Non-secret environment (CONTRACTS.md §9.2). LDM_HOST is fixed to eks by this chart.
# Default target: the tenant's existing PostgreSQL database on the shared RDS instance
# (PG_*), staging in the token's prefix of the shared S3 bucket (S3_STAGING_BUCKET). The
# AZSQL_*/AZ_* keys are only for the optional Azure rehearsal overlay (azure: true).
env:
  PG_HOST: ""
  PG_PORT: "5432"
  PG_DATABASE: ""
  PG_SSLMODE: require
  S3_STAGING_BUCKET: ""
  AWS_REGION: us-east-1
  # optional S3-compatible endpoint (localstack / MinIO); empty = AWS
  S3_ENDPOINT_URL: ""
  AZSQL_SERVER: ""
  AZSQL_DATABASE: ""
  AZSQL_AUTH: sql
  AZ_STORAGE_ACCOUNT: ""
  AZ_STAGING_CONTAINER: ""
  # Source estate: only the family the tenant's manifest source.driver names is used at run time.
  DB2_HOST: db2-archive
  DB2_PORT: "50000"
  DB2_DATABASE: ""
  ORACLE_HOST: oracle-archive
  ORACLE_PORT: "1521"
  ORACLE_SERVICE: FREEPDB1
  # comma-separated label=url pairs added to the reconciliation sessions array
  DEVIN_SESSION_LINKS: ""
  # command (manifest source.unload_command) | builtin (ldm's fixed-width writer)
  LDM_UNLOAD_MODE: command

# db2 | oracle - the tenant manifest's source.driver. Picks the source credentials Secret and the
# client label the source estate's NetworkPolicy admits (ldm/db2-client or ldm/oracle-client).
sourceDriver: db2

secrets:
  # keys DB2_USER, DB2_PASSWORD (created by deploy-demo.sh for the db2-archive chart)
  db2: db2-archive-credentials
  # keys ORACLE_USER, ORACLE_PASSWORD (+ ORACLE_SYS_PASSWORD, not read by the job)
  oracle: oracle-archive-credentials
  # keys PG_USER, PG_PASSWORD (created by deploy-demo.sh from the tenant database credentials)
  postgres: ldm-postgres
  # keys AZSQL_USER, AZSQL_PASSWORD, AZ_STORAGE_KEY (created by ops from Key Vault); optional
  azure: ldm-azure

# Manifest + overlay are mounted over the copies baked into the image so the presenter can edit them
# without a rebuild. Leave empty to use the image's files.
manifest:
  mount: true
  base: ""      # contents of migration/manifest.yaml (helm --set-file manifest.base=migration/manifest.yaml)
  overlay: ""   # contents of migration/manifests/<token>.yaml

staging:
  sizeLimit: 10Gi

# Sized for PySpark local mode inside the single Job container (manifest execution.spark.*:
# local[*] master, 1g driver). Spark scratch lives on the staging emptyDir (SPARK_LOCAL_DIRS).
resources:
  requests:
    cpu: 500m
    memory: 1536Mi
  limits:
    cpu: "2"
    memory: 2560Mi

networkPolicy:
  enabled: true

serviceAccount:
  create: true
  # IRSA role for the S3 staging prefix (demo-aws Terraform output job_role_arn). Without it
  # the Job runs with the node role and S3 staging fails closed.
  roleArn: ""
  annotations: {}

replicaCount: 1
# Deployment rollout strategy (Kubernetes default RollingUpdate when empty).
# Tenants that alert on the double-run flaw set {type: Recreate} so a rollout
# does not overlap old and new replicas on the rollup window.
strategy: {}

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/workshop/otterworks-document-service
  tag: ""  # Set at deploy time (ECR uses IMMUTABLE tags)
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8083
  targetPort: 8083

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: document-service.otterworks.workshop.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: document-service-tls
      hosts:
        - document-service.otterworks.workshop.example.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

healthCheck:
  path: /health
  port: 8083

monitoring:
  enabled: true
  path: /metrics
  port: 8083
  # Namespace the incident rules/dashboard select on; defaults to the release namespace.
  namespaceLabel: ""
  # Rendered only when the monitoring.coreos.com/v1 API exists in the cluster.
  serviceMonitor:
    interval: 30s
    labels:
      release: prometheus
  # PrometheusRule rendered from files/incident_alerts.yml (synced from
  # observability/prometheus/incident_alerts.yml). Every selector is scoped to
  # namespaceLabel and each alert gets a static namespace label.
  rules:
    enabled: false
    labels:
      release: prometheus
    extraLabels: {}
  # Grafana dashboard ConfigMap rendered from files/incident-responder.json
  # (synced from observability/grafana/dashboards/incident-responder.json).
  dashboard:
    enabled: false
    uid: ""  # default: ir-<release namespace>
    datasourceUid: prometheus
    labels:
      grafana_dashboard: "1"
    annotations: {}
  # Base URLs written into alert annotations and dashboard text; empty keeps
  # the local Compose URLs from the source files.
  links:
    grafana: ""
    jaeger: ""

# OTLP/HTTP trace export (app/telemetry.py). Sets DOC_SVC_OTEL_ENABLED=true and
# OTEL_EXPORTER_OTLP_ENDPOINT, which overrides DOC_SVC_OTEL_EXPORTER_OTLP_ENDPOINT.
tracing:
  enabled: false
  endpoint: http://otel-collector.monitoring.svc.cluster.local:4318
  extraEnv: []

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

serviceAccount:
  roleArn: ""

# Non-sensitive service configuration rendered into {{ .Release.Name }}-config
# and injected via envFrom. Populate at deploy time (e.g. from Terraform outputs).
config: {}

# Sensitive configuration rendered into {{ .Release.Name }}-secrets (Opaque,
# stringData) and injected via envFrom. Populate at deploy time; never commit values.
secrets: {}

replicaCount: 1

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/workshop/otterworks-audit-service
  tag: ""  # Set at deploy time (ECR uses IMMUTABLE tags)
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8090
  targetPort: 8090

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: audit-service.otterworks.workshop.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: audit-service-tls
      hosts:
        - audit-service.otterworks.workshop.example.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

healthCheck:
  path: /health
  port: 8090

monitoring:
  enabled: true
  path: /metrics
  port: 8090

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

serviceAccount:
  roleArn: ""

# Non-sensitive service configuration rendered into {{ .Release.Name }}-config
# and injected via envFrom. Populate at deploy time (e.g. from Terraform outputs).
config: {}

# Sensitive configuration rendered into {{ .Release.Name }}-secrets (Opaque,
# stringData) and injected via envFrom. Populate at deploy time; never commit values.
secrets: {}

# Legacy-data-migration archive read path (migration/CONTRACTS.md §10.4).
# Leave `store` empty for ordinary tenants: the archive feature stays off and the
# archive/reconciliation endpoints answer 404 with a hint. BEFORE deployments set
# `store: db2`, AFTER deployments set `store: postgresql` (the tenant's existing RDS
# database, where the migration job created the mig/stg/arch schemas) or, for the optional
# Azure rehearsal, `store: azuresql`. User/password/client-id are read from the Kubernetes
# Secret `archive-store-credentials` (keys DB2_USER, DB2_PASSWORD, PG_USER, PG_PASSWORD,
# AZSQL_USER, AZSQL_PASSWORD, AZURE_CLIENT_ID), created by the deploy
# script - never put them in values files.
archive:
  store: ""            # "" | db2 | postgresql | azuresql
  namespace: ""        # LDM_NAMESPACE, e.g. d24-after
  credentialsSecret: archive-store-credentials
  db2:
    host: db2-archive
    port: "50000"
    database: ""
  postgresql:
    host: ""           # shared RDS endpoint (deploy script fills from Terraform output)
    port: "5432"
    database: ""       # otterworks_<tenant>
    sslmode: require
  azuresql:
    server: ""         # <server>.database.windows.net
    database: ""
    auth: sql          # sql (AZSQL_USER/AZSQL_PASSWORD) | msi (AZURE_CLIENT_ID)
